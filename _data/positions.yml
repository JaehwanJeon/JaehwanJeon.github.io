# Positions and education — single source of truth (newest first).
# Rendered by the home page (Positions and education), the Education and
# Work experience sections of _pages/cv.md, and scripts/build_cv_pdf.rb.
#
# To add: copy a block and edit the fields.
#   section     : education | work           (CV section)
#   logo        : uoft | snu                 (logo on the home page; images/logos/logo-<logo>.png)
#   title       : degree or position
#   unit        : (optional) department or institute
#   institution : university or organisation
#   place       : (optional) city, country — printed in the CV education line
#   dates       : dates exactly as printed in the CV
#   period      : short dates for the home page
#   note        : (optional) home page only, e.g. the advisor

- section: work
  logo: uoft
