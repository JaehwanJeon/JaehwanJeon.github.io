---
layout: jj
---
{% include base_path %}<article>
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="post-body">
{{ content }}
  </div>
  <nav class="post-nav" aria-label="Posts">
    <a href="{{ base_path }}/year-archive/">All posts</a>{% if page.previous %} · Previous: <a href="{{ base_path }}{{ page.previous.url }}">{{ page.previous.title }}</a>{% endif %}{% if page.next %} · Next: <a href="{{ base_path }}{{ page.next.url }}">{{ page.next.title }}</a>{% endif %}
  </nav>
</article>
